<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link rel="stylesheet" href="./css/main.css">   
    <script src="./js/main.js" defer></script>
    <style>
        table,
        tr,
        th,
        td {
            border: solid;
        }
    </style>
    <title>最終課題</title>
</head>
<body>  
    <header>
        <h1>カフェ Final assignment</h1>
        <nav class="gnav">
            <ul>
                <li><a href="2.html">HOME</a></li>
                <li><a href="2.html">ABOUT</a></li>
                <li><a href="2.html">MENU</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="ho">
           <h2>会員登録</h2>  
           <p></p>
           <form action="index.html" method="post">
                <div>
                    <label for="lastname">姓：</label>
                    <input type="text" id="lastname" name="surname" placeholder="山田">

                    <label>
                        名：
                    <input type="text" id="firstname" name="firstname" required placeholder="太郎">
                    </label>
                </div>
                <div>
                    <label for="password">パスワードを設定</label>
                    <input type="password" name="password" id="password">
                </div>
                <div>
                    <input type="checkbox" name="agreement" id="agreement" value="true" checked>
                    <label for="agreement">プライバシーポリシーに同意する</label>
                </div>
                <div>
                    <input type="radio" name="gender" id="female">
                    <label for="female">女性</label>
                    <input type="radio" name="gender" id="male">
                    <label for="female">男性</label>
                    <input type="radio" name="gender" id="nane">
                    <label for="female">回答しない</label>
                </div>
                <div>
                    <label for="email">メールアドレス</label>
                    <input type="email" name="email" id="email">
                </div>
                <div>
                    <label for="birthday">生年月日</label>
                    <input type="date" name="birthday" id="birthday">
                    <input type="time" name="time" id="time">
                </div>
                <div>
                    <label for="tel">電話番号</label>
                    <input type="tel" name="tel" id="tel">
                </div>
                <div>
                    <input type="submit" value="送信">
                    <input type="reset" value="リセット">

           </form>
        </section>   
    </main>

    <footer>
        <a href="1.html">ホームに戻る</a>
    </footer>
</body>

</html>
